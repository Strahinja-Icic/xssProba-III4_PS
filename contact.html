<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cvećara Maslačići</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/contact.css">
</head>

<body>
    <div id="Header-wrapper" class="background-brown">
        <header>
            <nav>
                <a href="index.html" id="logo-header" class="text-white">
                    <img src="./images/LogoCvecara-white.png" alt="Logo">
                </a>

                <div id="links-header">
                    <a href="#" class="text-white">O nama</a>
                    <a href="#" class="text-white">Buketi</a>
                    <a href="./contact.html" class="text-white">Kontaktirajte nas</a>
                </div>
            </nav>
        </header>
    </div>

    <div id="main-wrapper">
        <main>
            <div>
                <h1 class="text-green">
                    Kontaktirajte nas
                </h1>

                <p class="text-green">
                    Pišite nam za porudžbine, pitanja ili posebne želje u vezi sa buketima
                </p>
            </div>

            <form action="">
                <div id="contact-inputs">
                    <div id="contact-left">
                        <div>
                            <label for="Topic-input"></label>
                            <input type="text" id="Topic-input" name="Topic-input" required placeholder="Tema" class="background-green text-white">
                        </div>
    
                        <div>
                            <label for="Name-input"></label>
                            <input type="text" id="Name-input" name="Name-input" required placeholder="Ime" class="background-green text-white">
                        </div>
    
                        <div>
                            <label for="Name-input"></label>
                            <input type="text" id="Surname-input" name="Surname-input" required placeholder="Prezime" class="background-green text-white">
                        </div>
    
                        <div>
                            <label for="Email-input"></label>
                            <input type="email" id="Email-input" name="Email-input" required placeholder="E-pošta" class="background-green text-white">
                        </div>
                    </div>
    
                    <div id="contact-right">
                        <label for="Message-input"></label>
                        <textarea name="Message-input" id="Message-input" cols="30" rows="10" required placeholder="Poruka" class="background-green text-white"></textarea>
                    </div>
                </div>

                <div id="contact-buttons">
                    <button id="submitButton" class="background-bourdeaux button text-white" type="submit">
                        Pošalji
                    </button>
    
                    <button id="resetButton" class="button background-red text-white" type="reset">
                        Obriši unete podatke
                    </button>
                </div>
            </form>
        </main>
    </div>


    <div id="Footer-wrapper" class="background-brown">
        <footer>
            <div id="footer-up">
                <div id="navigation-part">
                    <h2 class="text-white">
                        Navigacija
                    </h2>

                    <div>
                        <a href="./index.html" class="text-white">Početna stranica</a>
                        <a href="#" class="text-white">Buketi</a>
                        <a href="#" class="text-white">O nama</a>
                        <a href="./contact.html" class="text-white">Kontaktirajte nas</a>
                    </div>
                </div>

                <div id="logos-part">
                    <a href="index.html">
                        <img src="./images/LogoCvecara-white.png" alt="logo">
                    </a>

                    <div>
                        <a href="#">
                            <img src="./images/instagram.svg" alt="instagram" class="logo-navigation">
                        </a>
                        <a href="#">
                            <img src="./images/facebook.svg" alt="facebook" class="logo-navigation">
                        </a>

                        <a href="#">
                            <img src="./images/youtube.svg" alt="youtube" class="logo-navigation">
                        </a>
                    </div>
                </div>

                <div id="contact-part">
                    <h2 class="text-white">
                        Kontakt informacije
                    </h2>

                    <div id="kontakt-informacije">
                        <div>
                            <img src="./images/location.svg" alt="lokacija" class="logo-contact">

                            <p class="text-white">
                                Cara Dušana 87, Niš
                            </p>
                        </div>

                        <div>
                            <img src="./images/envelope.svg" alt="E-posta" class="logo-contact">

                            <p class="text-white">
                                cvecaramaslacici@gmail.com
                            </p>
                        </div>

                        <div>
                            <img src="./images/phone.svg" alt="Broj tel" class="logo-contact">

                            <p class="text-white">
                                064/127 46 75
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <p class="text-white" id="copyright">
                ©2026, sva prava zadržana
            </p>
        </footer>
    </div>
</body>

</html>
